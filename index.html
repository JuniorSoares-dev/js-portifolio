<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/hero.css" />

    <link
      rel="icon"
      href="assets/icons/monograma-favicon-js-final.png"
      type="image/png"
    />

    <title>Junior Soares | Desenvolvedor Front-end</title>
  </head>
  <body>
    <div class="hero-wrapper">
      <header class="main-header">
        <div class="logo-header">
          <a href="#">
            <img
              class="monograma-header"
              src="assets/icons/monograma-js.png"
              alt=""
            />
          </a>
          <span class="divisor"></span>
          <span class="nome-header">Junior Soares</span>
        </div>
        <button
          class="menu-hamburger"
          aria-label="Abrir menu"
          aria-expanded="false"
        >
          <span class="linha"></span>
          <span class="linha-menor"></span>
        </button>
      </header>
      <section class="hero">
        <img
          class="hero-foto"
          src="assets/images/junior-prin-img.webp"
          alt="Junior Soares Desenvolvedor"
        />
        <div class="hero-label">
          <span class="linha-hero"></span>
          <p>DESENVOLVEDOR FRONT-END</p>
        </div>
        <div class="hero-content">
          <h1>
            Sites que <br />
            transformam <br />
            ideias em <br />
            <span>presença <br> digital.</span>
          </h1>
          <p>
            Desenvolvo interfaces modernas, funcionais e responsivas unindo
            design e código para criar soluções que fazem a diferença.
          </p>
        </div>
        <div class="hero-bottom">
          <a href="#projetos">Ver projetos</a>
          <a href="#contato">Entrar em contato</a>
        </div>
      </section>
    </div>
  </body>
</html>
